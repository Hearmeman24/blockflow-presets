name: validate

# Trigger philosophy:
#   - Anything that touches a `registry/*/preset.json` / `workflow.json`,
#     the JSON schema, `manifest.json`, or the validator tools → CI runs.
#   - Docs, license, .gitignore, README edits → skip CI entirely (waste of
#     runner time + the live-install job is GPU-cost-bearing).
on:
  push:
    branches: [main]
    paths:
      - 'registry/**'
      - 'schema/**'
      - 'tools/**'
      - 'manifest.json'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'registry/**'
      - 'schema/**'
      - 'tools/**'
      - 'manifest.json'
      - '.github/workflows/validate.yml'
  # Live-install job triggers:
  #   - pull_request_target with the `validate-live` label (maintainer adds
  #     after reviewing the preset.json + workflow.json)
  #   - manual workflow_dispatch with explicit preset_id
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      preset_id:
        description: 'Preset ID to live-install (e.g. qwen-image-lighting)'
        required: true
        type: string

jobs:
  # ---------------------------------------------------------------------------
  # detect-changes — figure out WHICH preset directories were touched.
  # Downstream jobs use this output to scope themselves; the goal is to
  # validate only the preset(s) a PR actually changes, not the whole registry.
  # ---------------------------------------------------------------------------
  detect-changes:
    name: Detect changed presets
    runs-on: ubuntu-latest
    outputs:
      preset_ids: ${{ steps.scan.outputs.preset_ids }}
      schema_or_tools_changed: ${{ steps.scan.outputs.schema_or_tools_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need history for `git diff` against base

      - id: scan
        name: Scan changed files
        run: |
          set -euo pipefail

          # Resolve the base ref to diff against.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.event.pull_request.base.ref }}"
          else
            base="${{ github.event.before }}"
          fi

          # On a first push (force-push, fresh branch, etc.) `before` is all-zeros.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD~1"
            git rev-parse --verify "$base" >/dev/null 2>&1 || base="HEAD"
          fi

          echo "Diffing against: $base"
          changed="$(git diff --name-only "$base" HEAD || true)"
          echo "--- changed files ---"
          echo "$changed"
          echo "---------------------"

          # Preset dirs that have a present preset.json (added/modified, not deleted).
          # `grep` returning no matches must NOT kill the pipeline (we expect 0
          # changed presets on docs-only / workflow-only commits).
          preset_ids="$(echo "$changed" \
            | { grep -E '^registry/[^/]+/' || true; } \
            | awk -F/ '{print $2}' \
            | sort -u \
            | while read -r id; do
                if [ -n "$id" ] && [ -f "registry/$id/preset.json" ]; then
                  echo "$id"
                fi
              done \
            | paste -sd ' ' -)"

          schema_or_tools="false"
          if echo "$changed" | grep -qE '^(schema/|tools/|manifest\.json)'; then
            schema_or_tools="true"
          fi

          echo "preset_ids='${preset_ids}'"
          echo "schema_or_tools_changed='${schema_or_tools}'"
          echo "preset_ids=${preset_ids}" >> "$GITHUB_OUTPUT"
          echo "schema_or_tools_changed=${schema_or_tools}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # schema-and-sizes — fast checks, no network. Always runs.
  # Validates the WHOLE registry against the schema (the cost is microseconds)
  # but scopes URL checks to only the changed presets.
  # ---------------------------------------------------------------------------
  schema-and-sizes:
    name: Schema + sizes
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Validate registry (schema + size-sum)
        run: python tools/validate.py

      - name: Verify manifest.json is up-to-date
        run: python tools/build_manifest.py --check

  # ---------------------------------------------------------------------------
  # url-check — HEAD-checks every model URL referenced by CHANGED presets.
  # Skips when only schema/tools/manifest changed (those don't carry URLs).
  # ---------------------------------------------------------------------------
  url-check:
    name: URL reachability (changed presets)
    needs: detect-changes
    if: needs.detect-changes.outputs.preset_ids != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install jsonschema
        run: pip install jsonschema

      - name: HEAD-check URLs for changed presets
        run: |
          set -euo pipefail
          ids="${{ needs.detect-changes.outputs.preset_ids }}"
          only_flags=""
          for id in $ids; do
            only_flags="$only_flags --only $id"
          done
          echo "Running: python tools/validate.py --check-urls $only_flags"
          python tools/validate.py --check-urls $only_flags

  # ---------------------------------------------------------------------------
  # live-install — full provision → install → generate → teardown for a single
  # preset against real RunPod. ~\$1 per run, ~20 min wall-clock.
  #
  # Trigger model: maintainer-only, via the `validate-live` label on a PR.
  # External contributors can open a PR adding a preset; the cheap schema +
  # URL jobs (above) run automatically. The maintainer reviews + adds the
  # `validate-live` label when they want to burn credit on the live test.
  #
  # Secrets (set under Settings → Secrets and variables → Actions):
  #   RUNPOD_API_KEY              — credit-bearing RunPod key
  #   PRESET_TEST_S3_ACCESS       — AWS / R2 access key (ComfyGen writes outputs here)
  #   PRESET_TEST_S3_SECRET
  #   PRESET_TEST_S3_BUCKET
  #   PRESET_TEST_S3_REGION       — eu-west-2, auto, etc.
  #   PRESET_TEST_S3_ENDPOINT_URL — empty for AWS, set for R2-compatibles
  #
  # Trust model: pull_request_target gives the workflow access to secrets and
  # checks out the BASE branch's code by default. We explicitly check out the
  # PR's data files (preset.json / workflow.json) but run the BASE branch's
  # tools/ci_live_install.py — so a malicious PR can't modify the runner script
  # to exfiltrate secrets. The PR's data still needs maintainer review before
  # the `validate-live` label is added.
  # ---------------------------------------------------------------------------
  live-install:
    name: Live install + smoke
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'pull_request_target' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'validate-live') ||
      github.event_name == 'workflow_dispatch'
    # 60 min ceiling — observed: GH-hosted runners' worker-to-HuggingFace
    # bandwidth runs ~50-60% of a local network's, so a 14-min local download
    # of the Qwen preset (52GB) stretches to 25-35 min in CI. 60 min keeps a
    # safety margin without leaving the job pinned overnight if something hangs.
    timeout-minutes: 60
    steps:
      - name: Check out BASE branch (trusted runner script + tools)
        uses: actions/checkout@v4

      - name: Check out PR HEAD for preset data only
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Drop into a sibling dir so it can't overwrite the trusted tools/
          path: pr-checkout
          fetch-depth: 1

      - name: Resolve preset_id (from PR diff or workflow_dispatch input)
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            preset_id="${{ github.event.inputs.preset_id }}"
          else
            # Label trigger on a PR — compute the changed preset(s) ourselves
            # since we don't depend on the detect-changes job here.
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            # Make sure both commits are local
            git -C pr-checkout fetch origin "$base" --depth 1 || true
            changed="$(cd pr-checkout && git diff --name-only "$base" "$head" 2>/dev/null \
              || git diff --name-only "origin/${{ github.event.pull_request.base.ref }}" HEAD)"
            preset_id="$(echo "$changed" \
              | { grep -E '^registry/[^/]+/' || true; } \
              | awk -F/ '{print $2}' \
              | sort -u \
              | head -1)"
          fi
          if [ -z "$preset_id" ]; then
            echo "::error::no preset_id resolved (no changed presets in PR?)"
            exit 1
          fi
          echo "preset_id=$preset_id" >> "$GITHUB_OUTPUT"
          echo "Live-installing preset: $preset_id"

      - name: Stage PR's preset data into the base checkout
        if: github.event_name == 'pull_request_target'
        env:
          PRESET_ID: ${{ steps.resolve.outputs.preset_id }}
        run: |
          set -euo pipefail
          src="pr-checkout/registry/$PRESET_ID"
          dst="registry/$PRESET_ID"
          if [ ! -d "$src" ]; then
            echo "::error::PR doesn't contain registry/$PRESET_ID/"
            exit 1
          fi
          rm -rf "$dst"
          cp -R "$src" "$dst"
          ls -la "$dst"

      - name: Install Python deps (comfy-gen from GitHub source)
        run: |
          python3 -m pip install --upgrade pip
          # comfy-gen isn't on PyPI; install from the public repo source.
          pip install git+https://github.com/Hearmeman24/ComfyGen.git

      - name: Run live install validator
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          PRESET_TEST_S3_ACCESS: ${{ secrets.PRESET_TEST_S3_ACCESS }}
          PRESET_TEST_S3_SECRET: ${{ secrets.PRESET_TEST_S3_SECRET }}
          PRESET_TEST_S3_BUCKET: ${{ secrets.PRESET_TEST_S3_BUCKET }}
          PRESET_TEST_S3_REGION: ${{ secrets.PRESET_TEST_S3_REGION }}
          PRESET_TEST_S3_ENDPOINT_URL: ${{ secrets.PRESET_TEST_S3_ENDPOINT_URL }}
        run: python3 tools/ci_live_install.py "${{ steps.resolve.outputs.preset_id }}"
